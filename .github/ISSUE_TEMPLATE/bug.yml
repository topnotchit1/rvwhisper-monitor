name: Bug report
description: Report a reproducible dashboard or collector problem without including private telemetry.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, device IDs, MAC addresses, locations, or unredacted payloads."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Dashboard UI, RV Whisper collector, Normalizer, SQLite history, Raspberry Pi deployment]
    validations:
      required: true
